[phases.setup]
  nixpkgsArchive = "23.11"
  nixPkgs = ["php", "php83Extensions.composer", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.bcmath", "php83Extensions.curl", "php83Extensions.zip", "php83Extensions.gd", "nodejs", "npm"]

[phases.install]
  dependsOn = ["setup"]
  cmds = ["composer install --no-dev --optimize-autoloader", "npm install --ignore-scripts"]

[phases.build]
  dependsOn = ["install"]
  cmds = ["php artisan config:clear", "php artisan route:clear", "php artisan view:clear", "php artisan migrate --force", "php artisan db:seed --force", "php artisan config:cache", "php artisan route:cache", "php artisan view:cache"]

[start]
  cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
