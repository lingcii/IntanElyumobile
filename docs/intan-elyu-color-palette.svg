<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#193375" />
    </linearGradient>
    <linearGradient id="submitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Filters for crisp shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="620" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Title Banner -->
  <rect x="24" y="24" width="832" height="64" rx="14" fill="url(#headerGrad)" />
  <text x="48" y="54" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="0.5">INTAN-ELYU BRAND COLOR PALETTE</text>
  <text x="48" y="74" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Visual Color Tokens, Gradients &amp; Surface Specifications</text>

  <!-- Section 1: Primary Brand & Action Swatches -->
  <text x="28" y="118" fill="#1e293b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">1. Core Brand &amp; Accent Colors</text>

  <!-- Swatch 1: Royal Blue -->
  <g transform="translate(28, 130)">
    <rect width="128" height="136" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="8" y="8" width="112" height="64" rx="10" fill="#1e3a8a" />
    <text x="12" y="92" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Royal Blue</text>
    <text x="12" y="108" fill="#1e3a8a" font-family="monospace" font-size="11" font-weight="700">#1e3a8a</text>
    <text x="12" y="124" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Main Headers</text>
  </g>

  <!-- Swatch 2: Coastal Deep Navy -->
  <g transform="translate(168, 130)">
    <rect width="128" height="136" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="8" y="8" width="112" height="64" rx="10" fill="#193375" />
    <text x="12" y="92" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Coastal Navy</text>
    <text x="12" y="108" fill="#193375" font-family="monospace" font-size="11" font-weight="700">#193375</text>
    <text x="12" y="124" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Header Gradients</text>
  </g>

  <!-- Swatch 3: Surf Sky Cyan -->
  <g transform="translate(308, 130)">
    <rect width="128" height="136" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="8" y="8" width="112" height="64" rx="10" fill="#38bdf8" />
    <text x="12" y="92" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Surf Sky Cyan</text>
    <text x="12" y="108" fill="#0284c7" font-family="monospace" font-size="11" font-weight="700">#38bdf8</text>
    <text x="12" y="124" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Camera / Highlights</text>
  </g>

  <!-- Swatch 4: Emerald Green -->
  <g transform="translate(448, 130)">
    <rect width="128" height="136" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="8" y="8" width="112" height="64" rx="10" fill="#10b981" />
    <text x="12" y="92" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Emerald Green</text>
    <text x="12" y="108" fill="#059669" font-family="monospace" font-size="11" font-weight="700">#10b981</text>
    <text x="12" y="124" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Submit Button</text>
  </g>

  <!-- Swatch 5: Amber Gold -->
  <g transform="translate(588, 130)">
    <rect width="128" height="136" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="8" y="8" width="112" height="64" rx="10" fill="#f59e0b" />
    <text x="12" y="92" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Amber Gold</text>
    <text x="12" y="108" fill="#d97706" font-family="monospace" font-size="11" font-weight="700">#f59e0b</text>
    <text x="12" y="124" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Points &amp; Offline</text>
  </g>

  <!-- Swatch 6: Crimson Alert -->
  <g transform="translate(728, 130)">
    <rect width="124" height="136" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="8" y="8" width="108" height="64" rx="10" fill="#ef4444" />
    <text x="12" y="92" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Crimson Red</text>
    <text x="12" y="108" fill="#dc2626" font-family="monospace" font-size="11" font-weight="700">#ef4444</text>
    <text x="12" y="124" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Delete / Reject</text>
  </g>

  <!-- Section 2: UI Gradients -->
  <text x="28" y="304" fill="#1e293b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">2. Component Gradients &amp; Interactive Buttons</text>

  <!-- Gradient Card 1: Royal Blue Header -->
  <g transform="translate(28, 318)">
    <rect width="260" height="96" rx="16" fill="url(#headerGrad)" stroke="#193375" stroke-width="1.5" filter="url(#shadow)" />
    <text x="20" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Header Banner Gradient</text>
    <text x="20" y="66" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">180deg: #1e3a8a → #193375</text>
    <text x="20" y="82" fill="rgba(255,255,255,0.75)" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Used in: Modal Headers &amp; Top Bars</text>
  </g>

  <!-- Gradient Card 2: Emerald Submit Button -->
  <g transform="translate(308, 318)">
    <rect width="260" height="96" rx="16" fill="url(#submitGrad)" stroke="#059669" stroke-width="1.5" filter="url(#shadow)" />
    <text x="20" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Submit Button Gradient</text>
    <text x="20" y="66" fill="#ecfdf5" font-family="monospace" font-size="11" font-weight="700">135deg: #10b981 → #059669</text>
    <text x="20" y="82" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Used in: Primary 'Submit' Buttons</text>
  </g>

  <!-- Gradient Card 3: Camera Action Button -->
  <g transform="translate(588, 318)">
    <rect width="264" height="96" rx="16" fill="url(#cyanGrad)" stroke="#0369a1" stroke-width="1.5" filter="url(#shadow)" />
    <text x="20" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Take Photo Action Gradient</text>
    <text x="20" y="66" fill="#e0f2fe" font-family="monospace" font-size="11" font-weight="700">135deg: #0284c7 → #0369a1</text>
    <text x="20" y="82" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Used in: Camera / Action Triggers</text>
  </g>

  <!-- Section 3: Neutral & Surface Tokens -->
  <text x="28" y="454" fill="#1e293b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">3. Surfaces &amp; Neutral Canvas Tokens</text>

  <!-- Neutral 1: Slate Dark -->
  <g transform="translate(28, 468)">
    <rect width="128" height="116" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="14" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Dark Navy</text>
    <text x="14" y="52" fill="#94a3b8" font-family="monospace" font-size="11">#0f172a</text>
    <text x="14" y="74" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Headings &amp; Badges</text>
  </g>

  <!-- Neutral 2: Body Text Slate -->
  <g transform="translate(168, 468)">
    <rect width="128" height="116" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="8" y="8" width="112" height="34" rx="8" fill="#334155" />
    <text x="14" y="64" fill="#1e293b" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Body Slate</text>
    <text x="14" y="82" fill="#334155" font-family="monospace" font-size="11">#334155</text>
    <text x="14" y="100" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">Primary Body Copy</text>
  </g>

  <!-- Neutral 3: Muted Caption -->
  <g transform="translate(308, 468)">
    <rect width="128" height="116" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="8" y="8" width="112" height="34" rx="8" fill="#64748b" />
    <text x="14" y="64" fill="#1e293b" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Muted Slate</text>
    <text x="14" y="82" fill="#64748b" font-family="monospace" font-size="11">#64748b</text>
    <text x="14" y="100" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">Subtitles &amp; Timestamps</text>
  </g>

  <!-- Neutral 4: Border Subtle -->
  <g transform="translate(448, 468)">
    <rect width="128" height="116" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <rect x="8" y="8" width="112" height="34" rx="8" fill="#e2e8f0" />
    <text x="14" y="64" fill="#1e293b" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Border Gray</text>
    <text x="14" y="82" fill="#64748b" font-family="monospace" font-size="11">#e2e8f0</text>
    <text x="14" y="100" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">Card Dividers</text>
  </g>

  <!-- Neutral 5: Card Light -->
  <g transform="translate(588, 468)">
    <rect width="128" height="116" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="8" y="8" width="112" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="64" fill="#1e293b" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Footer Light</text>
    <text x="14" y="82" fill="#64748b" font-family="monospace" font-size="11">#f8fafc</text>
    <text x="14" y="100" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">Modal Bottom Bar</text>
  </g>

  <!-- Neutral 6: Pure White -->
  <g transform="translate(728, 468)">
    <rect width="124" height="116" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <rect x="8" y="8" width="108" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="64" fill="#1e293b" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Pure White</text>
    <text x="14" y="82" fill="#0284c7" font-family="monospace" font-size="11">#ffffff</text>
    <text x="14" y="100" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">Middle Modal Body</text>
  </g>
</svg>
