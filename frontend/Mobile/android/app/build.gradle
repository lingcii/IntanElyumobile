apply plugin: 'com.android.application'

android {
    namespace = "com.intan.elyu"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.intan.elyu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.4.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        androidResources {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.apk'
        }
    }
    signingConfigs {
        release {
            storeFile file('intan-elyu-key.jks')
            storePassword System.getenv("INTAN_KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD") ?: 'IntanElyu2026!'
            keyAlias System.getenv("INTAN_KEY_ALIAS") ?: System.getenv("KEY_ALIAS") ?: 'intanelyu'
            keyPassword System.getenv("INTAN_KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD") ?: 'IntanElyu2026!'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Auto-sync Gradle build output to Web Download folder without manual intervention
def syncApkToWeb(String buildType) {
    def srcApk = file("${projectDir}/build/outputs/apk/${buildType}/app-${buildType}.apk")
    if (srcApk.exists()) {
        def targetDir = file("${projectDir}/../../public/downloads")
        targetDir.mkdirs()
        copy {
            from srcApk
            into targetDir
            rename { 'intan-elyu.apk' }
        }
        def srcDownloads = file("${projectDir}/../../src/downloads")
        srcDownloads.mkdirs()
        copy {
            from srcApk
            into srcDownloads
            rename { 'intan-elyu.apk' }
        }
        copy {
            from srcApk
            into file("${projectDir}/../..")
            rename { "app-${buildType}.apk" }
        }
        copy {
            from srcApk
            into file("${projectDir}/../..")
            rename { "IntanElyu-v${android.defaultConfig.versionName}-${buildType}.apk" }
        }
        println "[Intan Elyu] Synchronized fresh ${buildType} APK (${srcApk.length()} bytes) to public/downloads/intan-elyu.apk"
    }
}

afterEvaluate {
    tasks.findByName('assembleRelease')?.doLast {
        syncApkToWeb('release')
    }
    tasks.findByName('assembleDebug')?.doLast {
        syncApkToWeb('debug')
    }
}
